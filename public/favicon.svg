<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Icon Container -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Network Connection Lines -->
  <path d="M16 16L7 10M16 16L25 10M16 16L8 23M16 16L24 23" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  
  <!-- Outer Satellite Nodes -->
  <circle cx="7" cy="10" r="2.4" fill="#38bdf8" />
  <circle cx="25" cy="10" r="2.4" fill="#818cf8" />
  <circle cx="8" cy="23" r="2.4" fill="#38bdf8" />
  <circle cx="24" cy="23" r="2.4" fill="#a855f7" />
  
  <!-- Center Gateway Node with Pulse -->
  <circle cx="16" cy="16" r="4.2" fill="url(#pulseGrad)" filter="url(#glow)"/>
  <circle cx="16" cy="16" r="2" fill="#ffffff" />
  
  <!-- Signal Broadcast Arcs -->
  <path d="M12 11A6 6 0 0 1 20 11" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
